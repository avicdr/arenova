<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="/arenova.ico" />
    <link rel="shortcut icon" href="/arenova.ico" />
    <link rel="icon" type="image/png" href="/arenova.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/arenova.png" />
    <title>404 - Page Not Found | ARENOVA</title>
    <meta name="description" content="The requested page could not be found on ARENOVA." />
    <meta name="robots" content="noindex, nofollow" />

    <!-- Self-Hosted Fonts -->
    <style>
      @font-face {
        font-family: 'Syne';
        font-style: normal;
        font-weight: 700 800;
        font-display: swap;
        src: url('/fonts/syne-bold.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Plus Jakarta Sans';
        font-style: normal;
        font-weight: 400 700;
        font-display: swap;
        src: url('/fonts/plus-jakarta-sans.woff2') format('woff2');
      }
    </style>

    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --color-bg: #0c0b0a;
        --color-surface: rgba(22, 21, 20, 0.72);
        --color-border: rgba(232, 75, 44, 0.28);
        --color-flame: #E84B2C;
        --color-flame-light: #FF7043;
        --color-gold: #D6BA93;
        --color-text-main: #F3F0E8;
        --color-text-muted: #A39E93;
      }

      html, body {
        width: 100%;
        height: 100%;
        background-color: var(--color-bg);
        color: var(--color-text-main);
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        overflow-x: hidden;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }

      .grid-overlay {
        position: fixed;
        inset: 0;
        background-image:
          linear-gradient(to right, rgba(243, 240, 232, 0.025) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(243, 240, 232, 0.025) 1px, transparent 1px);
        background-size: 60px 60px;
        pointer-events: none;
        z-index: 1;
      }

      .ambient-glow {
        position: fixed;
        inset: 0;
        background:
          radial-gradient(circle at 50% 40%, rgba(232, 75, 44, 0.16) 0%, transparent 60%),
          radial-gradient(circle at 20% 80%, rgba(214, 186, 147, 0.08) 0%, transparent 50%),
          radial-gradient(circle at 80% 20%, rgba(232, 75, 44, 0.08) 0%, transparent 50%);
        pointer-events: none;
        z-index: 2;
      }

      #particles-canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 3;
      }

      .content-wrapper {
        position: relative;
        z-index: 10;
        width: 100%;
        max-width: 640px;
        padding: 24px;
        margin: auto;
      }

      .card {
        background: var(--color-surface);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid var(--color-border);
        border-radius: 24px;
        padding: 48px 36px;
        text-align: center;
        box-shadow:
          0 20px 60px -15px rgba(0, 0, 0, 0.8),
          0 0 40px -10px rgba(232, 75, 44, 0.2);
        position: relative;
        overflow: hidden;
      }

      .card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 20%;
        right: 20%;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(232, 75, 44, 0.8), transparent);
      }

      .brand-header {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 24px;
        text-decoration: none;
      }

      .brand-logo {
        width: 44px;
        height: 44px;
        object-fit: contain;
        filter: drop-shadow(0 0 10px rgba(232, 75, 44, 0.4));
      }

      .brand-name {
        font-family: 'Syne', sans-serif;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.24em;
        color: var(--color-text-main);
      }

      .status-badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 14px;
        border-radius: 9999px;
        background: rgba(232, 75, 44, 0.1);
        border: 1px solid rgba(232, 75, 44, 0.3);
        margin-bottom: 24px;
      }

      .status-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background-color: var(--color-flame);
        box-shadow: 0 0 10px var(--color-flame);
      }

      .status-text {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 11px;
        letter-spacing: 0.12em;
        color: var(--color-flame-light);
        text-transform: uppercase;
      }

      .glitch-404 {
        font-family: 'Syne', sans-serif;
        font-size: clamp(84px, 16vw, 130px);
        font-weight: 800;
        line-height: 0.95;
        letter-spacing: -0.04em;
        background: linear-gradient(180deg, #FFFFFF 10%, #D6BA93 50%, #E84B2C 90%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 16px;
        user-select: none;
      }

      .title {
        font-family: 'Syne', sans-serif;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -0.01em;
        color: var(--color-text-main);
        margin-bottom: 10px;
      }

      .description {
        font-size: 15px;
        line-height: 1.6;
        color: var(--color-text-muted);
        max-width: 440px;
        margin: 0 auto 32px auto;
      }

      .action-buttons {
        display: flex;
        flex-direction: column;
        gap: 12px;
        width: 100%;
        max-width: 320px;
        margin: 0 auto;
      }

      .btn-primary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        width: 100%;
        padding: 14px 28px;
        background: linear-gradient(135deg, #E84B2C 0%, #D83F20 100%);
        color: #FFFFFF;
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-decoration: none;
        border-radius: 12px;
        box-shadow: 0 4px 20px -2px rgba(232, 75, 44, 0.5);
        transition: all 0.25s ease;
      }

      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(232, 75, 44, 0.65);
      }

      .secondary-links {
        display: flex;
        justify-content: center;
        gap: 18px;
        margin-top: 8px;
        font-size: 13px;
      }

      .secondary-links a {
        color: var(--color-text-muted);
        text-decoration: none;
        transition: color 0.2s ease;
      }

      .secondary-links a:hover {
        color: var(--color-text-main);
      }

      @media (max-width: 480px) {
        .card {
          padding: 36px 20px;
          border-radius: 20px;
        }
        .title {
          font-size: 20px;
        }
        .description {
          font-size: 14px;
        }
      }
    </style>
  </head>
  <body>
    <div class="grid-overlay"></div>
    <div class="ambient-glow"></div>
    <canvas id="particles-canvas"></canvas>

    <main class="content-wrapper">
      <div class="card">
        <a href="/" class="brand-header">
          <img src="/arenova-128.png" alt="ARENOVA Logo" class="brand-logo" onerror="this.src='/arenova.png'" />
          <span class="brand-name">ARENOVA</span>
        </a>

        <div>
          <div class="status-badge">
            <span class="status-dot"></span>
            <span class="status-text">Error 404 // Coordinate Out of Bounds</span>
          </div>
        </div>

        <div class="glitch-404">404</div>

        <h1 class="title">Page Not Found</h1>
        <p class="description">
          The requested page does not exist or has moved. Navigate to our main platform below.
        </p>

        <div class="action-buttons">
          <a href="/" class="btn-primary">
            <span>Return to Home</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </a>
          <div class="secondary-links">
            <a href="/pricing/">Pricing</a>
            <a href="/about/">About Us</a>
            <a href="/#ascent">Get an Audit</a>
          </div>
        </div>
      </div>
    </main>

    <script>
      const canvas = document.getElementById('particles-canvas');
      const ctx = canvas && canvas.getContext ? canvas.getContext('2d') : null;
      if (ctx) {
        function resizeCanvas() {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas, { passive: true });
        resizeCanvas();

        const particles = Array.from({ length: 32 }, () => ({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          radius: Math.random() * 2 + 0.8,
          speedY: -(Math.random() * 0.6 + 0.2),
          speedX: (Math.random() - 0.5) * 0.3,
          alpha: Math.random() * 0.6 + 0.2,
          color: Math.random() > 0.4 ? '232, 75, 44' : '214, 186, 147'
        }));

        function drawParticles() {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          for (let i = 0; i < particles.length; i++) {
            const p = particles[i];
            p.y += p.speedY;
            p.x += p.speedX;
            if (p.y < -10) {
              p.y = canvas.height + 10;
              p.x = Math.random() * canvas.width;
            }
            if (p.x < -10) p.x = canvas.width + 10;
            if (p.x > canvas.width + 10) p.x = -10;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(' + p.color + ', ' + p.alpha + ')';
            ctx.fill();
          }
          requestAnimationFrame(drawParticles);
        }
        if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          requestAnimationFrame(drawParticles);
        }
      }
    </script>
  </body>
</html>
